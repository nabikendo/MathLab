name: Build e Release MathLab Android
on:
  push:
    branches: [main]
    paths:
      - version.json
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_ENABLED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      # O workflow publica somente o MathLab; nenhum arquivo do SGE Diário é utilizado.
      - name: Preparar versão
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c 'import json;print(json.load(open("version.json"))["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Gerar projeto Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Configurar versão e identidade Android
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re,json
          v=json.load(open('version.json'))['version']
          parts=[int(x) for x in v.split('.')]
          code=parts[0]*1000000+parts[1]*1000+parts[2]+1
          p=pathlib.Path('android/app/build.gradle')
          s=p.read_text()
          s=re.sub(r'versionCode\s+\d+',f'versionCode {code}',s)
          s=re.sub(r'versionName\s+"[^"]+"',f'versionName "{v}"',s)
          p.write_text(s)
          PY
      - name: Compilar APK de testes
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Compilar APK de produção (se assinatura configurada)
        if: ${{ env.SIGNING_ENABLED == 'true' }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Assinar APK de produção
        if: ${{ env.SIGNING_ENABLED == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mathlab.jks"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/mathlab-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/mathlab.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out MathLab-Android.apk "$RUNNER_TEMP/mathlab-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify MathLab-Android.apk
      - name: Preparar pacote web
        run: zip -j MathLab-web.zip index.html version.json README.md
      - name: Preparar artefatos
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MathLab-Android-TESTE.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MathLab-Android-TESTE
          path: MathLab-Android-TESTE.apk
      - name: Criar ou atualizar Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "MathLab $TAG" --notes "Prévia Android: APK de TESTES (assinatura debug temporária). A atualização por cima de outra compilação não é garantida. Versão web incluída. Para atualizações Android estáveis é necessária assinatura de release persistente."
          fi
          gh release upload "$TAG" MathLab-web.zip MathLab-Android-TESTE.apk --clobber
          if [ -f MathLab-Android.apk ]; then gh release upload "$TAG" MathLab-Android.apk --clobber; fi
