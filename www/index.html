<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#39251d"><title>MathLab Expressive</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#251f1b;background:#f5f1ec}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:0}header{background:radial-gradient(circle at 90% 5%,#8e644d,#3c281f 65%);color:white;padding:34px max(22px,calc((100vw - 1050px)/2));border-radius:0 0 45px 45px}.top{display:flex;align-items:center;justify-content:space-between}.top small{color:#d8c5ba}.avatar{width:52px;height:52px;background:#dfff50;border-radius:50%;display:grid;place-items:center;color:#251f1b;font-size:25px}.welcome{display:flex;align-items:center;gap:15px}h1{font-size:28px;margin:0}h2{margin:0 0 6px}p{margin:4px 0 0}.pill{border-radius:50px;background:#ffffff22;color:white;padding:12px 18px;margin:22px 0}.topics{display:flex;gap:14px;overflow:auto;padding-bottom:6px}.topic{background:none;color:white;min-width:90px;text-align:center}.topic span{display:grid;place-items:center;background:#fff3;color:white;width:70px;height:70px;border:1px solid #ffffff55;border-radius:50%;margin:0 auto 8px;font-size:27px}.topic.active span{background:#e4ff4f;color:#252017}.cards{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:22px}.hero{min-height:145px;background:#ffffff24;border:1px solid #ffffff4a;border-radius:30px;padding:22px;color:white;text-align:left}.hero strong{font-size:21px}.hero small{display:block;color:#e1cfc5;margin-top:8px}main{max-width:1050px;margin:0 auto;padding:30px 22px 120px}.section{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}.muted{color:#857d78;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:15px}.tile{background:white;border-radius:28px;padding:22px;box-shadow:0 5px 25px #3220150b;text-align:left;color:#251f1b;min-height:150px}.tile .symbol{font-size:30px;margin-bottom:18px}.tile strong{font-size:19px;display:block}.tile small{color:#81766e}.exercise{background:white;padding:24px;border-radius:30px;margin-top:22px}.choices{display:grid;gap:9px;margin-top:16px}.choice{background:#f5f1ec;padding:13px 16px;border-radius:15px;text-align:left;color:#28211c}.choice.selected{background:#e5ff68}.choice.correct{background:#c7f1d5}.choice.wrong{background:#f9c9c2}.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.primary{background:#dfff4c;color:#272219;padding:13px 22px;border-radius:22px;font-weight:700}.secondary{background:#ece6e0;color:#352920;padding:13px 22px;border-radius:22px}.nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:#24211f;border-radius:60px;padding:9px;box-shadow:0 15px 40px #0005;z-index:5}.nav button{color:#bbb;background:transparent;padding:12px 16px;border-radius:40px}.nav button.active{color:#e5ff4f}.nav .center{background:#dfff4c;color:#28211c}.hidden{display:none}.status{margin-top:12px;font-weight:600}@media(max-width:550px){header{padding:28px 19px;border-radius:0 0 36px 36px}.cards{gap:10px}.hero{padding:16px;min-height:150px}.hero strong{font-size:17px}.topic{min-width:75px}.topic span{width:62px;height:62px}.nav button{padding:12px}h1{font-size:23px}}
</style></head><body>
<header><div class="top"><div class="welcome"><div class="avatar">∑</div><div><h1>Olá, estudante!</h1><small>Seu laboratório de Matemática</small></div></div><span><button onclick="checkMathLabUpdate(true)" title="Verificar atualizações" style="background:#ffffff22;color:white;border-radius:50%;padding:12px">↻</button></span></div>
<div class="pill">✦ Aprenda, pratique e domine a Matemática</div>
<div class="topics" id="topics"></div><div class="cards"><button class="hero" onclick="startDiagnostic()"><strong>Diagnóstico<br>matemático</strong><small>Descubra o que revisar →</small></button><button class="hero" onclick="openPractice()"><strong>Treino<br>progressivo</strong><small>Exercícios com explicação →</small></button></div></header>
<main><div class="section"><div><h2 id="sectionTitle">Escolhidos para você</h2><p class="muted" id="subtitle">Trilhas organizadas por pré-requisitos</p></div><span id="progress" class="muted"></span></div><div class="grid" id="catalog"></div>
<section class="exercise hidden" id="exercise"><p class="muted" id="counter"></p><h2 id="question"></h2><div class="choices" id="choices"></div><p class="status" id="feedback" aria-live="polite"></p><div class="actions"><button class="primary" id="check" onclick="checkAnswer()">Conferir resposta</button><button class="secondary" onclick="nextQuestion()">Próxima questão →</button></div></section></main>
<nav class="nav" aria-label="Navegação"><button onclick="showHome()" id="navHome" class="active">⌂ Início</button><button onclick="showTopics()">▦ Trilhas</button><button class="center" onclick="openPractice()">∑</button><button onclick="showProgress()">◷ Progresso</button></nav>
<script>
const topics=[['Fundamentos','＋'],['Álgebra','𝑥'],['Geometria','△'],['Estatística','▥'],['ENEM','✎']];
const items=[
{topic:0,title:'Operações fundamentais',q:'Quanto é 18 + 27?',choices:['35','45','55','46'],answer:1,why:'18 + 27 = 45.'},
{topic:0,title:'Frações',q:'Quanto é 1/2 + 1/4?',choices:['2/6','3/4','1/8','1/4'],answer:1,why:'1/2 = 2/4; então 2/4 + 1/4 = 3/4.'},
{topic:0,title:'Porcentagem',q:'Quanto é 25% de 200?',choices:['25','40','50','75'],answer:2,why:'25/100 × 200 = 50.'},
{topic:1,title:'Equações',q:'Resolva: 3x + 5 = 20',choices:['3','4','5','6'],answer:2,why:'3x = 15; x = 5.'},
{topic:1,title:'Funções',q:'Se f(x) = 2x + 1, quanto vale f(4)?',choices:['7','8','9','10'],answer:2,why:'f(4) = 2×4 + 1 = 9.'},
{topic:1,title:'Potenciação',q:'Quanto é 2³ × 2²?',choices:['16','32','64','8'],answer:1,why:'Somamos os expoentes: 2⁵ = 32.'},
{topic:2,title:'Área',q:'Qual a área de um retângulo de 8 cm por 5 cm?',choices:['13 cm²','26 cm²','40 cm²','80 cm²'],answer:2,why:'Área = base × altura = 8 × 5 = 40 cm².'},
{topic:2,title:'Triângulos',q:'Qual a soma dos ângulos internos de um triângulo?',choices:['90°','180°','270°','360°'],answer:1,why:'A soma é sempre 180° na geometria euclidiana plana.'},
{topic:3,title:'Média',q:'Qual a média de 4, 6 e 8?',choices:['5','6','7','8'],answer:1,why:'(4 + 6 + 8)/3 = 6.'},
{topic:3,title:'Probabilidade',q:'Uma moeda equilibrada é lançada. Qual a chance de cara?',choices:['25%','50%','75%','100%'],answer:1,why:'Um resultado favorável entre dois equiprováveis.'},
{topic:4,title:'ENEM • proporção',q:'Uma receita para 4 pessoas usa 300 g de arroz. Para 8 pessoas, quanto arroz é necessário?',choices:['450 g','500 g','600 g','900 g'],answer:2,why:'Dobrar as pessoas dobra a quantidade: 600 g.'},
{topic:4,title:'ENEM • desconto',q:'Um produto de R$ 120 recebe desconto de 10%. Qual o preço final?',choices:['R$ 108','R$ 110','R$ 112','R$ 118'],answer:0,why:'10% de 120 = 12; 120 − 12 = 108.'}
];
let filter=-1,queue=items.map((_,i)=>i),pos=0,selected=-1,checked=false,diagnostic=false;
const $=id=>document.getElementById(id);
function saved(){try{return JSON.parse(localStorage.getItem('mathlab-progress')||'{}')}catch{return {}}}
function record(index,correct){const p=saved();const k=String(index);const v=p[k]||{attempts:0,correct:0};v.attempts++;if(correct)v.correct++;p[k]=v;localStorage.setItem('mathlab-progress',JSON.stringify(p))}
function renderTopics(){ $('topics').innerHTML=topics.map((t,i)=>'<button class="topic '+(filter===i?'active':'')+'" onclick="chooseTopic('+i+')"><span>'+t[1]+'</span>'+t[0]+'</button>').join('')}
function renderCatalog(){const arr=items.map((x,i)=>({...x,index:i})).filter(x=>filter<0||x.topic===filter);$('catalog').innerHTML=arr.map(x=>'<button class="tile" onclick="practiceItem('+x.index+')"><div class="symbol">'+topics[x.topic][1]+'</div><strong>'+x.title+'</strong><small>'+topics[x.topic][0]+' · Praticar →</small></button>').join('');const p=saved();$('progress').textContent=Object.values(p).reduce((a,x)=>a+x.attempts,0)+' respostas registradas'}
function chooseTopic(i){filter=i;renderTopics();renderCatalog();$('exercise').classList.add('hidden');$('sectionTitle').textContent=topics[i][0];$('subtitle').textContent='Selecione uma atividade para começar'}
function showHome(){filter=-1;renderTopics();renderCatalog();$('exercise').classList.add('hidden');$('sectionTitle').textContent='Escolhidos para você';$('subtitle').textContent='Trilhas organizadas por pré-requisitos'}
function showTopics(){showHome();$('sectionTitle').textContent='Todas as trilhas';$('catalog').scrollIntoView({behavior:'smooth'})}
function practiceItem(i){diagnostic=false;queue=[i];pos=0;showExercise()}
function openPractice(){diagnostic=false;queue=items.map((_,i)=>i);pos=0;showExercise()}
function startDiagnostic(){diagnostic=true;queue=[0,1,2,3,4,6,8,10];pos=0;showExercise()}
function showExercise(){selected=-1;checked=false;const i=queue[pos],x=items[i];$('exercise').classList.remove('hidden');$('counter').textContent=(diagnostic?'Diagnóstico':'Treino')+' · Questão '+(pos+1)+' de '+queue.length+' · '+x.title;$('question').textContent=x.q;$('choices').innerHTML=x.choices.map((c,j)=>'<button class="choice" id="choice'+j+'" onclick="pick('+j+')">'+String.fromCharCode(65+j)+') '+c+'</button>').join('');$('feedback').textContent='';$('check').disabled=false;$('exercise').scrollIntoView({behavior:'smooth'})}
function pick(j){if(checked)return;selected=j;document.querySelectorAll('.choice').forEach((el,k)=>el.classList.toggle('selected',j===k))}
function checkAnswer(){if(checked||selected<0){$('feedback').textContent='Selecione uma alternativa.';return}checked=true;const x=items[queue[pos]],ok=selected===x.answer;record(queue[pos],ok);document.querySelectorAll('.choice').forEach((el,k)=>{el.classList.remove('selected');if(k===x.answer)el.classList.add('correct');else if(k===selected)el.classList.add('wrong')});$('feedback').textContent=(ok?'Correto! ':'Revise: ')+x.why;$('check').disabled=true;renderCatalog()}
function nextQuestion(){if(pos<queue.length-1){pos++;showExercise()}else{showProgress()}}
function showProgress(){const p=saved(),total=Object.values(p).reduce((a,x)=>a+x.attempts,0),hits=Object.values(p).reduce((a,x)=>a+x.correct,0);$('exercise').classList.add('hidden');$('sectionTitle').textContent='Meu progresso';$('subtitle').textContent=total+' respostas · '+(total?Math.round(100*hits/total):0)+'% de acertos';$('catalog').innerHTML=topics.map((t,i)=>{const ids=items.map((x,j)=>x.topic===i?j:-1).filter(j=>j>=0);const a=ids.reduce((n,j)=>n+(p[j]?.attempts||0),0),c=ids.reduce((n,j)=>n+(p[j]?.correct||0),0);return '<div class="tile"><div class="symbol">'+t[1]+'</div><strong>'+t[0]+'</strong><small>'+a+' tentativas · '+(a?Math.round(c/a*100):0)+'% de acertos</small></div>'}).join('')}
renderTopics();renderCatalog();
</script>
<div id="updateNotice" role="status" aria-live="polite" style="display:none;position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:99;background:#25211e;color:#fff;padding:15px 18px;border-radius:22px;box-shadow:0 12px 36px #0005;max-width:calc(100vw - 24px);width:420px"><strong id="updateTitle">Atualização disponível</strong><p id="updateMessage" style="font-size:13px;color:#ddd;margin:6px 0 12px"></p><button class="primary" id="updateNow">Atualizar agora</button> <button class="secondary" id="updateLater">Mais tarde</button></div>
<script>
const MATHLAB_VERSION='0.4.0';
const VERSION_URL='https://raw.githubusercontent.com/nabikendo/MathLab/main/version.json';
function compareVersion(a,b){const aa=String(a).replace(/^v/,'').split('.').map(Number),bb=String(b).replace(/^v/,'').split('.').map(Number);for(let i=0;i<3;i++){if((aa[i]||0)!==(bb[i]||0))return (aa[i]||0)>(bb[i]||0)?1:-1}return 0}
async function checkMathLabUpdate(manual=false){
 
 try{const response=await fetch(VERSION_URL+'?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const info=await response.json();if(!/^\d+\.\d+\.\d+$/.test(info.version))throw Error('Versão inválida');if(compareVersion(info.version,MATHLAB_VERSION)<=0){if(manual)alert('Você já usa a versão mais recente: '+MATHLAB_VERSION);return}if(!manual&&sessionStorage.getItem('mathlab-deferred')===info.version)return;
 document.getElementById('updateTitle').textContent='MathLab v'+info.version+' disponível';document.getElementById('updateMessage').textContent=info.notes||'Uma nova versão está pronta.';document.getElementById('updateNotice').style.display='block';document.getElementById('updateNow').onclick=async()=>{const url='https://github.com/nabikendo/MathLab/releases/tag/v'+encodeURIComponent(info.version);try{if(window.Capacitor?.Plugins?.Browser){await window.Capacitor.Plugins.Browser.open({url})}else{window.open(url,'_blank')}}catch(e){window.location.href=url}};document.getElementById('updateLater').onclick=()=>{sessionStorage.setItem('mathlab-deferred',info.version);document.getElementById('updateNotice').style.display='none'};
 }catch(e){if(manual)alert('Não foi possível verificar atualizações: '+e.message)}
}
window.addEventListener('load',()=>checkMathLabUpdate(false));
</script>
</body></html>
